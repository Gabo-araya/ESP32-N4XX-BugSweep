; ESP32-N4XX-BugSweep — ESP32-D0WD-V3 + LCD 1.9" ST7789 (170x320)
; Pinout de la pantalla: ver docs/FICHA_DISPOSITIVO.md

[env:esp32-lcd19]
platform = espressif32@^6.9.0        ; núcleo Arduino 2.x (estable con TFT_eSPI)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; 3 MB para la app (sin OTA): WiFi + BLE no caben en los 1.25 MB por defecto.
board_build.partitions = huge_app.csv

build_unflags = -std=gnu++11

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.3

; TFT_eSPI se configura aquí (en vez de editar User_Setup.h dentro de la librería),
; así la configuración vive con el proyecto y no se pierde al actualizar.
build_flags =
    -std=gnu++17
    -D BUGSWEEP_VERSION=\"0.9.0-beta\"   ; única fuente de la versión (ver CHANGELOG.md)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1
    -D TFT_MOSI=23        ; SDA  en la serigrafía
    -D TFT_SCLK=18        ; SCL
    -D TFT_CS=15          ; CS
    -D TFT_DC=2           ; RS
    -D TFT_RST=4          ; RST
    -D TFT_BL=32          ; LEDK (retroiluminación)
    -D TFT_BACKLIGHT_ON=HIGH   ; si la pantalla queda negra, prueba LOW
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; NimBLE solo como OBSERVADOR: sin anunciarse ni conectarse (garantía de solo recepción)
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1   ; la pantalla no es táctil: silencia el aviso de TOUCH_CS
